<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ΛΑΦ Λιτοχώρου</title>
    
    <!-- Branding & PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#0f110e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0f110e; --text: #e5e7eb; --text-muted: #9ca3af;
            --card-grad: linear-gradient(135deg, #2d3328 0%, #1a1d18 100%);
            --border: rgba(255, 255, 255, 0.1); --nav-bg: rgba(15, 17, 14, 0.95);
            --gold: #c5a059; --tile-bg: rgba(255, 255, 255, 0.05);
        }
        [data-theme="light"] {
            --bg: #f3f4f6; --text: #111827; --text-muted: #4b5563;
            --card-grad: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
            --border: rgba(0, 0, 0, 0.1); --nav-bg: rgba(255, 255, 255, 0.95);
            --gold: #9a7b42; --tile-bg: #ffffff;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); transition: all 0.3s ease; -webkit-tap-highlight-color: transparent; }
        .tactical-card { background: var(--card-grad); border: 1px solid var(--border); }
        .gold-text { color: var(--gold); }
        .nav-active { color: var(--gold); border-top: 2px solid var(--gold); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Smooth Scrolling for focusing today */
        html { scroll-behavior: smooth; }
        .past-day { opacity: 0.3; filter: grayscale(1); }
        .today-highlight { border: 2px solid var(--gold) !important; }
    </style>
</head>
<body class="pb-24 no-scrollbar">

    <!-- HEADER -->
    <header class="p-4 border-b border-[var(--border)] sticky top-0 z-40 bg-[var(--bg)]/80 backdrop-blur-lg">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div class="flex items-center gap-3">
                <img src="icon.png" class="w-10 h-10 rounded-xl shadow-lg border border-[var(--border)]" alt="Logo">
                <div>
                    <h1 class="text-sm font-black gold-text uppercase leading-none">ΛΑΦ Λιτοχώρου</h1>
                    <p class="text-[9px] text-[var(--text-muted)] font-bold uppercase tracking-tighter mt-1 italic">XXIV ΤΘΤ - Με θέα τον Όλυμπο</p>
                </div>
            </div>
            <button onclick="toggleTheme()" class="w-10 h-10 flex items-center justify-center rounded-full bg-[var(--tile-bg)] transition active:scale-90">
                <span id="theme-icon" class="text-lg">☀️</span>
            </button>
        </div>
    </header>

    <main id="main-content" class="max-w-md mx-auto p-4">
        
        <!-- PAGE: HOME -->
        <div id="page-home" class="space-y-6">
            <div class="flex justify-between items-end px-1">
                <h3 class="text-lg font-extrabold" id="hero-title">Το Μενού Σήμερα</h3>
                <span id="date-display" class="text-[10px] text-[var(--text-muted)] font-black uppercase tracking-widest italic"></span>
            </div>
            
            <div id="today-card" class="tactical-card p-7 rounded-[2.5rem] relative overflow-hidden min-h-[220px] flex flex-col justify-center transition-all duration-500">
                <div class="text-center py-10 opacity-40 font-bold italic">Φόρτωση...</div>
            </div>

            <!-- TILES & MAP -->
            <div class="grid grid-cols-2 gap-3">
                <a href="https://www.google.com/maps/search/?api=1&query=40.103986,22.493922" class="bg-[var(--tile-bg)] border border-[var(--border)] p-4 rounded-2xl flex flex-col items-center gap-2 active:scale-95 transition">
                    <span class="text-2xl">🗺️</span>
                    <p class="text-[10px] font-black uppercase tracking-tighter text-center">Οδηγίες Χάρτη</p>
                </a>
                <a href="tel:2352094087" class="bg-[var(--tile-bg)] border border-[var(--border)] p-4 rounded-2xl flex flex-col items-center gap-2 active:scale-95 transition text-center">
                    <span class="text-2xl">📞</span>
                    <p class="text-[10px] font-black uppercase tracking-tighter">Τηλέφωνο ΛΑΦ</p>
                </a>
            </div>
        </div>

        <!-- PAGE: PRICES (Canteen Catalog) -->
        <div id="page-prices" class="hidden space-y-6 pb-10">
            <div class="flex flex-col gap-2 px-1">
                <h3 class="text-xl font-black italic">Τιμοκατάλογος Κυλικείου</h3>
                <input type="text" id="price-search" placeholder="Αναζήτηση (π.χ. καφές, μπύρα)..." class="bg-[var(--tile-bg)] border border-[var(--border)] rounded-xl p-3 text-sm focus:outline-none focus:border-[var(--gold)]">
            </div>
            
            <div id="canteen-categories" class="space-y-8">
                <!-- Hardcoded Data Injected via JS -->
            </div>
        </div>

        <!-- PAGE: PROGRAM (Full Month) -->
        <div id="page-program" class="hidden space-y-4 pb-10">
            <div class="px-1 flex justify-between items-center">
                <h3 class="text-xl font-black italic">Πρόγραμμα Μηνός</h3>
                <button onclick="scrollToToday()" class="text-[9px] bg-[var(--gold)] text-black font-black px-2 py-1 rounded-lg uppercase">Πηγαινε στο Σημερα</button>
            </div>
            <div id="full-program-list" class="space-y-3">
                <!-- Data injected by JS -->
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer id="global-footer" class="max-w-md mx-auto p-10 text-center space-y-4 opacity-40">
        <div class="w-12 h-[1px] bg-[var(--gold)] mx-auto"></div>
        <p class="text-[9px] font-black uppercase tracking-widest leading-loose">
            ΛΑΦ Λιτοχώρου<br>
            Εντός Στρατοπέδου Μπαλανίκα<br>
            Τηλ: 2352094087
        </p>
    </footer>

    <!-- NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 border-t border-[var(--border)] px-8 py-4 flex justify-around items-center z-50 bg-[var(--nav-bg)]/90 backdrop-blur-xl">
        <button onclick="switchTab('home')" id="btn-home" class="flex flex-col items-center gap-1.5 nav-active transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10M9 21h6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span class="text-[8px] font-black tracking-widest uppercase">Αρχικη</span>
        </button>
        <button onclick="switchTab('program')" id="btn-program" class="flex flex-col items-center gap-1.5 text-[var(--text-muted)] transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span class="text-[8px] font-black tracking-widest uppercase">Μενού</span>
        </button>
        <button onclick="switchTab('prices')" id="btn-prices" class="flex flex-col items-center gap-1.5 text-[var(--text-muted)] transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span class="text-[8px] font-black tracking-widest uppercase">Κυλικειο</span>
        </button>
    </nav>

    <script>
        let menuData = [];
        
        // CANTEEN DATABASE (from images)
        const canteenItems = [
            { category: "☕ Ροφήματα - Καφέδες", items: [
                { name: "Φραπέ - Νες", price: "0,50€" }, { name: "Espresso Μονός", price: "0,55€" },
                { name: "Freddo Espresso", price: "0,95€" }, { name: "Freddo Cappuccino", price: "1,00€" },
                { name: "Capuccino", price: "0,90€" }, { name: "Ελληνικός Διπλός", price: "0,55€" }
            ]},
            { category: "🥤 Αναψυκτικά", items: [
                { name: "Νερό 0.5L", price: "0,11€" }, { name: "Coca Cola / Zero", price: "0,94€" },
                { name: "Hell Energy", price: "0,59€" }, { name: "7UP Free", price: "0,68€" }
            ]},
            { category: "🍔 Απογευματινά Πιάτα", items: [
                { name: "Burger με Πατάτες", price: "4,40€" }, { name: "Club Sandwich", price: "2,15€" },
                { name: "Πίτα Club Γύρος", price: "3,95€" }, { name: "Pizza Special", price: "5,65€" }
            ]},
            { category: "🥗 Σαλάτες & Ορεκτικά", items: [
                { name: "Χωριάτικη", price: "2,45€" }, { name: "Chef (Σεφ)", price: "2,78€" },
                { name: "Πατάτες Τηγανητές", price: "1,05€" }, { name: "Τζατζίκι", price: "0,80€" }
            ]},
            { category: "🔥 Σχάρας", items: [
                { name: "Σουβλάκι Χοιρινό (3τμχ)", price: "2,95€" }, { name: "Μπριζόλα Χοιρινή", price: "2,75€" },
                { name: "Ποικιλία Κρεατικών", price: "11,75€" }
            ]}
        ];

        async function initApp() {
            try {
                const response = await fetch('menu.json');
                menuData = await response.json();
                renderUI();
                renderCanteen();
            } catch (e) { console.error(e); }
            initTheme();
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        }

        function renderUI() {
            const now = new Date();
            const isLate = now.getHours() >= 15;
            const targetDate = isLate ? new Date(now.getTime() + 86400000) : now;
            
            const formatDate = (d) => {
                const day = d.getDate().toString().padStart(2, '0');
                const months = ["ΙΑΝ", "ΦΕΒ", "ΜΑΡ", "ΑΠΡ", "ΜΑΙ", "ΙΟΥΝ", "ΙΟΥΛ", "ΑΥΓ", "ΣΕΠ", "ΟΚΤ", "ΝΟΕ", "ΔΕΚ"];
                return `${day} ${months[d.getMonth()]} ${d.getFullYear().toString().slice(-2)}`;
            };

            const dateStr = formatDate(targetDate);
            document.getElementById('date-display').innerText = dateStr;
            document.getElementById('hero-title').innerText = isLate ? "Το Μενού Αύριο" : "Το Μενού Σήμερα";

            const meal = menuData.find(item => item.date === dateStr);
            const card = document.getElementById('today-card');

            if (meal) {
                const isSame = meal.meal_a.trim() === meal.meal_b.trim();
                card.innerHTML = `
                    <div class="space-y-6">
                        <div>
                            <span class="text-[9px] font-black gold-text uppercase tracking-widest opacity-60">Γεύμα Α</span>
                            <p class="text-xl font-black leading-tight uppercase mt-1">${meal.meal_a}</p>
                        </div>
                        ${meal.meal_b && !isSame ? `
                            <div class="h-[1px] bg-[var(--border)] w-8"></div>
                            <div>
                                <span class="text-[9px] font-black gold-text uppercase tracking-widest opacity-60">Γεύμα Β</span>
                                <p class="text-xl font-black leading-tight uppercase mt-1">${meal.meal_b}</p>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            // Render Full List with Focus Logic
            const list = document.getElementById('full-program-list');
            const todayClean = new Date(); todayClean.setHours(0,0,0,0);

            list.innerHTML = menuData.map(item => {
                const [d, mon, y] = item.date.split(' ');
                const mIdx = ["ΙΑΝ", "ΦΕΒ", "ΜΑΡ", "ΑΠΡ", "ΜΑΙ", "ΙΟΥΝ", "ΙΟΥΛ", "ΑΥΓ", "ΣΕΠ", "ΟΚΤ", "ΝΟΕ", "ΔΕΚ"].indexOf(mon);
                const itemDate = new Date(2000 + parseInt(y), mIdx, parseInt(d));
                
                const isPast = itemDate < todayClean;
                const isToday = item.date === dateStr;

                return `
                <div id="day-${item.date.replace(/ /g, '-')}" class="p-4 rounded-2xl flex gap-4 items-center border border-[var(--border)] transition-all ${isPast ? 'past-day' : 'bg-[var(--tile-bg)]'} ${isToday ? 'today-highlight' : ''}">
                    <div class="text-center bg-black/20 rounded-xl p-2 min-w-[60px] border border-white/5">
                        <div class="text-[9px] font-black opacity-40 uppercase">${item.day.slice(0,3)}</div>
                        <div class="font-black text-xl leading-none mt-0.5">${item.date.split(' ')[0]}</div>
                    </div>
                    <div class="flex-1 space-y-1">
                        <p class="text-[11px] font-bold leading-tight uppercase ${isToday ? 'gold-text' : ''}">${item.meal_a}</p>
                        ${item.meal_b && item.meal_a !== item.meal_b ? `<p class="text-[11px] font-bold leading-tight opacity-50 uppercase">${item.meal_b}</p>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        function scrollToToday() {
            const now = new Date();
            const isLate = now.getHours() >= 15;
            const target = isLate ? new Date(now.getTime() + 86400000) : now;
            const months = ["ΙΑΝ", "ΦΕΒ", "ΜΑΡ", "ΑΠΡ", "ΜΑΙ", "ΙΟΥΝ", "ΙΟΥΛ", "ΑΥΓ", "ΣΕΠ", "ΟΚΤ", "ΝΟΕ", "ΔΕΚ"];
            const id = `day-${target.getDate().toString().padStart(2, '0')}-${months[target.getMonth()]}-${target.getFullYear().toString().slice(-2)}`;
            
            const el = document.getElementById(id);
            if (el) window.scrollTo({ top: el.offsetTop - 100, behavior: 'smooth' });
        }

        function renderCanteen(query = "") {
            const container = document.getElementById('canteen-categories');
            const filtered = canteenItems.map(cat => ({
                ...cat,
                items: cat.items.filter(i => i.name.toLowerCase().includes(query.toLowerCase()))
            })).filter(cat => cat.items.length > 0);

            container.innerHTML = filtered.map(cat => `
                <section>
                    <h4 class="gold-text text-[10px] font-black uppercase tracking-[0.2em] mb-3 px-1">${cat.category}</h4>
                    <div class="bg-[var(--tile-bg)] rounded-3xl border border-[var(--border)] overflow-hidden divide-y divide-[var(--border)]">
                        ${cat.items.map(i => `
                            <div class="flex justify-between p-4 items-center">
                                <span class="text-sm font-bold uppercase tracking-tighter">${i.name}</span>
                                <span class="text-sm font-black gold-text">${i.price}</span>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `).join('');
        }

        document.getElementById('price-search').addEventListener('input', (e) => renderCanteen(e.target.value));

        function switchTab(tabId) {
            ['home', 'prices', 'program'].forEach(id => {
                document.getElementById('page-' + id).classList.add('hidden');
                document.getElementById('btn-' + id).classList.remove('nav-active', 'gold-text');
                document.getElementById('btn-' + id).classList.add('text-[var(--text-muted)]');
            });
            document.getElementById('page-' + tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).classList.add('nav-active', 'gold-text');
            window.scrollTo(0,0);
            if (tabId === 'program') setTimeout(scrollToToday, 300);
        }

        function toggleTheme() {
            const target = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            document.getElementById('theme-icon').innerText = target === 'dark' ? '☀️' : '🌙';
        }

        function initTheme() {
            const saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            document.getElementById('theme-icon').innerText = saved === 'dark' ? '☀️' : '🌙';
        }

        initApp();
    </script>
</body>
</html>
